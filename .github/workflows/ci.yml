name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repository tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: node scripts/validate-commit-message.mjs --pr-title
      - name: Validate PR branch
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pr-branch.mjs
      - name: Install pinned tooling
        run: pnpm install --frozen-lockfile
      - name: Validate commit and release contracts
        run: pnpm check

  ios:
    name: iOS build and entry journeys
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive apps/ios/AQD apps/ios/AQDTests apps/ios/AQDUITests
      - name: Build and test on an installed iPhone Simulator
        run: |
          device=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device" && test "$device" != null
          xcodebuild -quiet -project apps/ios/AQD.xcodeproj -scheme AQD -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/AQD" -resultBundlePath "$RUNNER_TEMP/Entry.xcresult" test CODE_SIGN_IDENTITY=-
      - name: Preserve native test and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: entry-native-results
          path: ${{ runner.temp }}/Entry.xcresult
          if-no-files-found: ignore

  backend:
    name: Entry Supabase integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start isolated local backend
        run: supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - name: Check database functions
        run: supabase db lint --local --schema public,aqd_private --level warning --fail-on warning
      - name: Verify real auth and account isolation
        run: python3 scripts/test-entry-backend.py
      - name: Stop isolated backend
        if: always()
        run: supabase stop > /dev/null 2>&1
