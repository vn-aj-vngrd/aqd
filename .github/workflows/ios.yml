name: Native iOS

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'scripts/test-ios.sh'
      - 'scripts/prove-ios.sh'
      - 'scripts/validate-ios-proof.mjs'
      - 'scripts/ios-destination.mjs'
      - 'scripts/seed-ios-test-photo.sh'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'scripts/test-ios.sh'
      - 'scripts/prove-ios.sh'
      - 'scripts/validate-ios-proof.mjs'
      - 'scripts/ios-destination.mjs'
      - 'scripts/seed-ios-test-photo.sh'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope (full E2E is tracked in issue #30)'
        type: choice
        default: unit
        options: [unit, all, e2e]
      acceptance_issue:
        description: 'Optional issue number with a persisted focused UI selection'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native iOS tests
    runs-on: macos-latest
    # Unit checks plus the PR issue's selected ACs; full regression remains #30.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record available toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list --json > /tmp/aqd-ci-simulators.json
      - name: Select installed iPhone 17 Pro Max simulator
        run: |
          node scripts/ios-destination.mjs --json > "$RUNNER_TEMP/aqd-destination.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'aqd-destination.json')) as source:
              selected = json.load(source)
          if int(selected['os'].split('.')[0]) < 18:
              raise SystemExit('Selected MVP simulator is below the iOS18 deployment minimum')
          print(f"Hosted simulator: {selected['name']} / iOS{selected['os']} ({selected['udid']}); separate from physical-phone proof")
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"IOS_DESTINATION={selected['destination']}\n")
              env.write(f"IOS_DERIVED_DATA={os.environ['RUNNER_TEMP']}/aqd-derived\n")
          PY
      - name: Run selected native test scope
        env:
          IOS_TEST_SCOPE: ${{ inputs.test_scope || 'unit' }}
        run: ./scripts/test-ios.sh
      - name: Run issue acceptance proof
        if: github.event_name == 'pull_request' || inputs.acceptance_issue != ''
        env:
          AQD_HEAD_BRANCH: ${{ github.head_ref }}
          AQD_ACCEPTANCE_ISSUE: ${{ inputs.acceptance_issue }}
          IOS_PROOF_OUTPUT: ${{ runner.temp }}/aqd-acceptance
        run: |
          issue="$AQD_ACCEPTANCE_ISSUE"
          if [[ -z "$issue" && "$AQD_HEAD_BRANCH" =~ ^van/issue-([1-9][0-9]*)/ ]]; then
            issue="${BASH_REMATCH[1]}"
          fi
          if [[ -n "$AQD_ACCEPTANCE_ISSUE" || ( -n "$issue" && -f "apps/ios/acceptance/issue-$issue.txt" ) ]]; then
            ./scripts/prove-ios.sh "$issue"
          else
            echo 'No issue selection scheduled; this is not UI acceptance proof.'
          fi
      - name: Retain issue acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-acceptance
          path: ${{ runner.temp }}/aqd-acceptance
          retention-days: 30
          if-no-files-found: ignore
      - name: Retain actual native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-results
          path: ${{ runner.temp }}/aqd-derived/Logs/Test/*.xcresult
          if-no-files-found: warn
