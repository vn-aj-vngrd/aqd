pre-commit:
  commands:
    whitespace:
      run: git diff --cached --check
    ios-layers:
      glob: "apps/ios/**/*.swift"
      run: node scripts/check-ios-layers.mjs
    ios-colors:
      glob: "apps/ios/**/*.swift"
      run: node scripts/check-ios-colors.mjs
    swiftlint:
      glob: "apps/ios/**/*.swift"
      run: command -v swiftlint >/dev/null && (cd apps/ios && swiftlint lint --quiet {staged_files}) || echo "swiftlint not installed; run brew install swiftlint"
    swiftformat:
      glob: "apps/ios/**/*.swift"
      run: command -v swiftformat >/dev/null && swiftformat --lint --config apps/ios/.swiftformat {staged_files} || echo "swiftformat not installed; run brew install swiftformat"
    tooling:
      glob: "{scripts/**,package.json,pnpm-lock.yaml,lefthook.yml,.releaserc.json,.github/workflows/**}"
      run: pnpm check

commit-msg:
  commands:
    conventional:
      run: node scripts/validate-commit-message.mjs "{1}"

pre-push:
  commands:
    protected-branches:
      run: node scripts/validate-push.mjs
      use_stdin: true
